<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Bed AI</title>
    <link rel="stylesheet" href="aihoi2.css">
    <script src="https://www.paypal.com/sdk/js?client-id=test&currency=USD"></script>
</head>
<body>
    <div class="container">
        <div class="controls">
            <div class="logo">NOVA BED <span>AI</span></div>
            
            <section>
                <h3>1. CHỌN MÀU SẮC ĐỆM</h3>
                <div class="color-options">
                    <div class="color-btn active" style="background: #000;" data-color="black"></div>
                    <div class="color-btn" style="background: #ffcc33;" data-color="yellow"></div>
                    <div class="color-btn" style="background: #ff6666;" data-color="red"></div>
                    <div class="color-btn" style="background: #33ccff;" data-color="blue"></div>
                    <div class="color-btn" style="background: #00ff99;" data-color="green"></div>
                    <div class="color-btn" style="background: #ff3399;" data-color="pink"></div>
                    <div class="color-btn" style="background: #7722ff;" data-color="purple"></div>
                </div>
            </section>

            <section>
                <h3>2. CHỌN HỌA TIẾT (PREMIUM)</h3>
                <div class="pattern-options">
                    <button class="pattern-btn active" data-pattern="none">Trơn</button>
                    <button class="pattern-btn" data-pattern="star">Sao (Star)</button>
                    <button class="pattern-btn" data-pattern="flower">Hoa (Flower)</button>
                    <button class="pattern-btn" data-pattern="both">Cả hai (Both)</button>
                </div>
            </section>

            <div class="checkout-area">
                <h2 id="total-price-display">Tổng: 1000 USD</h2>
                <div id="paypal-button-container"></div>
            </div>
        </div> <div class="preview-panel">
            <div class="img-frame">
                <img id="bed-preview" src="100.jpg" alt="Smart Bed">
            </div>
        </div>
    </div> <footer class="slide-footer">
        <div class="footer-line"></div>
        <div class="footer-content">
            <span class="left">YEUANHDOMIXI</span>
            <span class="right">NOVABED-2036</span>
        </div>
    </footer>

    <script src="aihoi3.js"></script>
</body>
</html>
